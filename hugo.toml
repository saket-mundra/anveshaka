baseURL = '/'
locale = 'en-us'
defaultContentLanguage = 'en'
title = 'Anveshaka'
paginate = 6 # Dynamic pagination: displays 6 posts per page with automatic 1, 2, 3... page navigation

[params]
  description = "Inner seeking, clarity, and quiet craftsmanship."
  # Musings page header. Kept separate from `description` on purpose: `description`
  # is the site-wide SEO/RSS summary, so reusing it for the header would change both.
  musingsTitle = "Seek and you shall find"          # the big line
  musingsTagline = "Anveshaka"   # the smaller line under it
  # Optional third line. Set it to show a sentence under the two lines; leave it out
  # (or set it to "") for a two-line header.
  # musingsLead = "Inner seeking, clarity, and quiet craftsmanship."
  author = "Saket Mundra"
  email = "saket@anveshaka.com"
  linkedin = "https://ca.linkedin.com/in/saketmundra"
  enableBlog = true # Temporarily set to true for live testing; set to false to hide Blog link
  headerStyle = "image"   # Options: "image" (Hero Cover Photo Layout) | "minimal" (Image-Free Professional Layout)
  minimalHeaderStyle = "" # Options: "" (Soft Sage Cream Band) | "dark-band" (Bold Dark Sage Hero)
  navStyle = "glass-nav"  # Options: "" (Clean Top Links) | "glass-nav" (Frosted Dark Glass Floating Pill)
  colorTheme = "sage"     # Options: "sage" (Default Sage Teal) | "gold" (Warm Champagne Gold) | "slate" (Midnight Slate & Ice)
  subscribeFormAction = "https://zgp4-zgp4.maillist-manage.in/weboptin.zc"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Musings"
    url = "/posts/"
    weight = 2
