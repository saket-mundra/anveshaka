{{ $paginator := .Paginator }}
{{ if gt $paginator.TotalPages 1 }}
<nav class="pagination" style="display: flex; justify-content: center; gap: 1rem; margin: 3rem 0 5rem;">
  {{ if $paginator.HasPrev }}
    <a href="{{ $paginator.Prev.URL }}" class="pagination-btn" style="border: 1px solid var(--border-color); padding: 0.5rem 1.25rem; border-radius: 4px; font-weight: 500; background-color: var(--card-bg);">&larr; Newer Posts</a>
  {{ end }}
  
  <span class="pagination-info" style="align-self: center; color: var(--text-muted); font-size: 0.95rem;">
    Page {{ $paginator.PageNumber }} of {{ $paginator.TotalPages }}
  </span>
  
  {{ if $paginator.HasNext }}
    <a href="{{ $paginator.Next.URL }}" class="pagination-btn" style="border: 1px solid var(--border-color); padding: 0.5rem 1.25rem; border-radius: 4px; font-weight: 500; background-color: var(--card-bg);">Older Posts &rarr;</a>
  {{ end }}
</nav>
{{ end }}
