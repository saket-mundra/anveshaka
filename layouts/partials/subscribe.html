<section class="subscribe-card">
  <div class="subscribe-inner">
    <h3>Subscribe to Musings</h3>
    <p>Receive quiet reflections and new essays directly in your inbox.</p>
    <form class="subscribe-form" action="{{ site.Params.subscribeFormAction | default "https://formspree.io/f/placeholder" }}" method="POST">
      <input type="email" name="email" placeholder="Your email address" required aria-label="Email address for subscription">
      <button type="submit">Subscribe</button>
    </form>
    <div class="subscribe-rss">
      <span>Or follow via RSS:</span>
      <a href="{{ "index.xml" | relURL }}" target="_blank" class="rss-link">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M6.18 15.64a2.18 2.18 0 0 1 2.18 2.18C8.36 19 7.38 20 6.18 20 5 20 4 19 4 17.82a2.18 2.18 0 0 1 2.18-2.18M4 4.44A15.56 15.56 0 0 1 19.56 20h-2.83A12.73 12.73 0 0 0 4 7.27V4.44m0 5.66a9.9 9.9 0 0 1 9.9 9.9h-2.83A7.07 7.07 0 0 0 4 12.93v-2.83Z"/>
        </svg>
        RSS Feed
      </a>
    </div>
  </div>
</section>
